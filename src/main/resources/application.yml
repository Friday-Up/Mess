# Mess应用主配置 - 激活dev环境，配置优先级: 命令行 > 系统属性 > 环境变量 > profile配置 > 本文件
server:
  port: 8080

spring:
  application:
    name: mess
  # 激活的环境: dev(开发) / prod(生产)
  profiles:
    active: dev

  # 数据源 - H2内存数据库(开发默认)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # H2控制台 - 仅开发环境使用
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # 开发: create-drop, 生产: update
    show-sql: true
    defer-datasource-initialization: true

  # 缓存: simple(内存) / redis(生产)
  cache:
    type: simple

  # Redis配置(生产环境使用)
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# Actuator监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# 应用信息(/actuator/info)
info:
  app:
    name: Mess
    description: Spring Boot Demo Project
    version: 1.0.0
    author: zhangyaolong.5
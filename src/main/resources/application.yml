# ============================================================
# Mess应用主配置文件
# ============================================================
# 配置加载优先级（从高到低）:
#   1. 命令行参数: --server.port=8081
#   2. 系统属性: -Dserver.port=8081
#   3. 环境变量: SERVER_PORT=8081
#   4. profile配置文件: application-{profile}.yml
#   5. 本文件: application.yml（默认配置）
#
# 多环境配置:
#   - 开发环境: application-dev.yml（H2内存数据库+简单缓存+DEBUG日志）
#   - 生产环境: application-prod.yml（PostgreSQL+Redis缓存+INFO日志）
#   - 激活方式: spring.profiles.active=dev 或 spring.profiles.active=prod
#   - profile配置会覆盖本文件中的同名配置项
#
# 配置验证:
#   - Actuator端点: http://localhost:8080/actuator/env 查看所有配置
#   - Actuator端点: http://localhost:8080/actuator/configprops 查看Bean属性
# ============================================================

server:
  port: 8080  # 应用监听端口，默认8080，可通过--server.port覆盖

spring:
  application:
    name: mess  # 应用名称，用于服务注册、日志标识、Actuator信息

  # --------------------------------------------------------
  # 环境配置
  # --------------------------------------------------------
  # 激活哪个profile就使用对应的application-{profile}.yml
  # 开发时用dev，部署时改为prod
  # --------------------------------------------------------
  profiles:
    active: dev  # 激活开发环境配置

  # --------------------------------------------------------
  # 数据源配置（默认H2内存数据库，生产环境在prod配置中覆盖）
  # --------------------------------------------------------
  # H2特点: 嵌入式、零配置、内存模式（重启数据丢失）
  # 生产环境应切换为PostgreSQL/MySQL，在application-prod.yml中配置
  # --------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:testdb              # H2内存数据库URL，mem:表示内存模式
    driver-class-name: org.h2.Driver      # H2 JDBC驱动类
    username: sa                          # H2默认管理员账号
    password: password                    # H2默认密码

  # --------------------------------------------------------
  # H2控制台配置
  # --------------------------------------------------------
  # 浏览器访问: http://localhost:8080/h2-console
  # 连接信息: JDBC URL=jdbc:h2:mem:testdb, User=sa, Password=password
  # 仅开发环境使用，生产环境应禁用（prod配置中关闭）
  # --------------------------------------------------------
  h2:
    console:
      enabled: true     # 启用H2控制台
      path: /h2-console  # 控制台访问路径

  # --------------------------------------------------------
  # JPA/Hibernate配置
  # --------------------------------------------------------
  # ddl-auto选项:
  #   create-drop: 启动时建表，关闭时删表（开发推荐）
  #   create: 启动时先删表再建表（危险，数据丢失）
  #   update: 启动时更新表结构（生产可用，但有风险）
  #   validate: 只验证表结构不修改（生产推荐配合Flyway）
  #   none: 不做任何操作
  #
  # defer-datasource-initialization: true
  #   确保schema.sql在Hibernate ddl-auto执行后再运行
  #   没有此配置，schema.sql可能在Hibernate建表前执行导致冲突
  # --------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect  # 数据库方言
    hibernate:
      ddl-auto: create-drop  # 开发: create-drop, 生产: update
    show-sql: true            # 打印SQL到控制台（开发用，生产关闭）
    defer-datasource-initialization: true  # schema.sql在Hibernate建表后执行

  # --------------------------------------------------------
  # 缓存配置
  # --------------------------------------------------------
  # simple: 基于ConcurrentHashMap的内存缓存（开发用）
  # redis: Redis分布式缓存（生产用，需安装Redis）
  # 切换方式: 在application-prod.yml中设置spring.cache.type=redis
  # --------------------------------------------------------
  cache:
    type: simple  # 内存缓存，无需外部依赖

  # --------------------------------------------------------
  # Redis配置（生产环境使用，开发环境可选）
  # --------------------------------------------------------
  # Lettuce客户端: 基于Netty的异步非阻塞客户端
  # 连接池: lettuce.pool配置连接池参数
  # --------------------------------------------------------
  redis:
    host: localhost     # Redis服务器地址
    port: 6379          # Redis默认端口
    timeout: 2000ms     # 连接超时2秒
    lettuce:            # Lettuce客户端连接池
      pool:
        max-active: 8   # 最大活跃连接数
        max-idle: 8     # 最大空闲连接数
        min-idle: 0     # 最小空闲连接数

# --------------------------------------------------------
# Actuator监控端点配置
# --------------------------------------------------------
# Spring Boot Actuator提供生产级监控能力:
#   health: 应用健康状态（数据库连接、磁盘空间等）
#   info: 应用信息（名称、版本、作者等）
#   metrics: 性能指标（HTTP请求统计、JVM内存、线程池等）
#   env: 环境变量和配置属性查看
#   beans: Spring Bean列表
#   configprops: @ConfigurationProperties配置属性
#   loggers: 日志级别查看和动态修改
#
# 访问示例:
#   http://localhost:8080/actuator/health
#   http://localhost:8080/actuator/metrics
#   http://localhost:8080/actuator/info
# --------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers
  endpoint:
    health:
      show-details: always  # 始终显示健康详情（生产建议when-authorized）
  info:
    env:
      enabled: true  # 启用/env端点中的info信息

# --------------------------------------------------------
# 应用信息（/actuator/info端点显示）
# --------------------------------------------------------
# 可通过http://localhost:8080/actuator/info查看
# 也可添加git.branch、git.commit等构建信息
# --------------------------------------------------------
info:
  app:
    name: Mess                              # 应用名称
    description: Spring Boot Demo Project   # 应用描述
    version: 1.0.0                          # 应用版本
    author: zhangyaolong.5                  # 作者
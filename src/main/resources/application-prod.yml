# 生产环境配置 - PostgreSQL + Redis缓存 + INFO日志
# 注意: 密码应使用环境变量注入，启用HTTPS，限制Actuator端点
server:
  port: 8080

spring:
  application:
    name: mess
  # PostgreSQL数据库(postgres为Docker Compose中的服务名)
  datasource:
    url: jdbc:postgresql://postgres:5432/mess
    username: postgres
    password: password  # 生产环境应使用环境变量
    driver-class-name: org.postgresql.Driver
  # JPA: update(保留数据) + 关闭SQL打印
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 生产建议用Flyway/Liquibase管理迁移
    show-sql: false
  # Redis分布式缓存(redis为Docker Compose中的服务名)
  cache:
    type: redis
  redis:
    host: redis
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# Actuator: 生产环境应限制暴露端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers
  endpoint:
    health:
      show-details: always  # 生产建议设为when-authorized
  info:
    env:
      enabled: true

# 日志: INFO级别
logging:
  level:
    root: INFO
    com.example.mess: INFO
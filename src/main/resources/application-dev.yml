# ============================================================
# Mess 开发环境配置文件
# 
# 当spring.profiles.active=dev时激活此配置文件。
# 开发环境使用H2内存数据库和简单缓存，便于快速启动和调试。
# 
# 开发环境特点:
# - 使用H2内存数据库，无需安装外部数据库
# - 启用H2控制台，方便查看数据库内容
# - 开启SQL日志打印，便于调试SQL语句
# - 使用简单内存缓存，无需安装Redis
# - 日志级别设为DEBUG，输出详细调试信息
# 
# 切换到开发环境的方式:
# 1. 在application.yml中设置 spring.profiles.active=dev
# 2. 启动参数: --spring.profiles.active=dev
# 3. 环境变量: SPRING_PROFILES_ACTIVE=dev
# 
# 作者: zhangyaolong.5
# 创建时间: 2026-05-26
# ============================================================

# -----------------------------------------------------------
# 服务器配置
# 开发环境使用默认端口8080
# -----------------------------------------------------------
server:
  port: 8080

# -----------------------------------------------------------
# Spring框架配置（开发环境覆盖）
# -----------------------------------------------------------
spring:
  # 应用名称
  application:
    name: mess

  # -------------------------------------------------------
  # 数据源配置 - H2内存数据库
  # 开发环境使用H2，数据存储在内存中，重启后丢失
  # 适合快速开发和单元测试
  # -------------------------------------------------------
  datasource:
    # H2内存数据库连接URL
    # MEM:testdb 表示内存模式
    url: jdbc:h2:mem:testdb
    # H2 JDBC驱动类
    driver-class-name: org.h2.Driver
    # 默认管理员用户名
    username: sa
    # 默认密码
    password: password

  # -------------------------------------------------------
  # H2控制台配置
  # 开发环境启用，可通过浏览器查看和操作数据库
  # 访问地址: http://localhost:8080/h2-console
  # 连接信息: JDBC URL=jdbc:h2:mem:testdb, User=sa, Password=password
  # -------------------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console

  # -------------------------------------------------------
  # JPA/Hibernate配置（开发环境）
  # create-drop: 启动时建表，关闭时删表，适合开发测试
  # show-sql: 打印SQL语句到控制台，便于调试
  # -------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # -------------------------------------------------------
  # 缓存配置 - 简单内存缓存
  # 开发环境使用ConcurrentMapCacheManager
  # 无需安装Redis，适合本地开发
  # -------------------------------------------------------
  cache:
    type: simple

  # -------------------------------------------------------
  # Redis配置（开发环境可选）
  # 本地Redis连接，如未安装Redis则使用简单缓存
  # -------------------------------------------------------
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# -----------------------------------------------------------
# Actuator监控配置（开发环境）
# 暴露所有常用端点，便于调试和监控
# -----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers
  endpoint:
    health:
      # 开发环境始终显示健康检查详情
      show-details: always
  info:
    env:
      enabled: true

# -----------------------------------------------------------
# 日志配置（开发环境）
# 设置为DEBUG级别，输出详细的调试信息
# -----------------------------------------------------------
logging:
  level:
    # 根日志级别: DEBUG，输出所有调试信息
    root: DEBUG
    # 应用包日志级别: DEBUG，输出应用代码的调试信息
    com.example.mess: DEBUG
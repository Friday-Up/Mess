# 开发环境配置 - H2内存数据库 + 简单缓存 + DEBUG日志
server:
  port: 8080

spring:
  application:
    name: mess
  # H2内存数据库，重启后数据丢失
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  # H2控制台: http://localhost:8080/h2-console (JDBC URL=jdbc:h2:mem:testdb)
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA: create-drop(启动建表/关闭删表) + 打印SQL
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # 简单内存缓存(无需Redis)
  cache:
    type: simple
  # Redis(可选，未安装则使用simple缓存)
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# Actuator: 暴露所有常用端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# 日志: DEBUG级别
logging:
  level:
    root: DEBUG
    com.example.mess: DEBUG
# ============================================================
# 测试环境配置 (application-test.properties)
# ============================================================
# 仅在测试时激活: @ActiveProfiles("test") 或 spring.profiles.active=test
# 设计原则:
#   - 使用H2内存数据库，测试完自动清理，不污染开发数据
#   - 关闭安全认证，简化测试代码（不需要mock认证）
#   - 开启DEBUG日志，方便定位测试失败原因
#   - 暴露所有Actuator端点，便于测试监控
#
# 与dev环境差异:
#   - DB_CLOSE_DELAY=-1: 延迟关闭数据库，确保测试期间连接可用
#   - DB_CLOSE_ON_EXIT=FALSE: JVM退出时不关闭数据库
#   - 暴露所有Actuator端点（*），dev只暴露常用端点
#   - management.security.enabled=false，禁用安全认证
# ============================================================

# --------------------------------------------------------
# H2内存数据库配置（测试专用）
# --------------------------------------------------------
# DB_CLOSE_DELAY=-1: 数据库在JVM运行期间保持打开
#   默认情况下H2在最后一个连接关闭时删除内存数据库
#   加此参数确保测试中数据库不会意外消失
# DB_CLOSE_ON_EXIT=FALSE: JVM退出时不自动关闭数据库
#   避免测试框架关闭时数据库提前销毁导致断言失败
# --------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --------------------------------------------------------
# JPA/Hibernate配置
# --------------------------------------------------------
# create-drop: 每个测试类前后重建表，确保测试数据隔离
# show-sql=true: 打印SQL语句，方便调试测试中的数据库操作
# format_sql=true: 格式化SQL输出，提高可读性
# --------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------
# 缓存配置
# --------------------------------------------------------
# simple: 使用ConcurrentHashMap内存缓存
# 测试环境不需要Redis，避免外部依赖
# --------------------------------------------------------
spring.cache.type=simple

# --------------------------------------------------------
# Redis配置（测试环境可选）
# --------------------------------------------------------
# 测试环境通常不依赖Redis，simple缓存即可
# 如果测试Redis缓存逻辑，需启动Redis服务
# --------------------------------------------------------
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

# --------------------------------------------------------
# 日志级别配置
# --------------------------------------------------------
# DEBUG级别: 打印详细的请求处理、SQL执行、安全认证信息
# 便于快速定位测试失败原因
# --------------------------------------------------------
logging.level.com.example.mess=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# --------------------------------------------------------
# Actuator监控配置（测试环境）
# --------------------------------------------------------
# security.enabled=false: 禁用安全认证，测试代码可直接访问端点
# exposure.include=*: 暴露所有端点，包括敏感端点（仅测试用）
# 生产环境绝不能这样配置！
# --------------------------------------------------------
management.security.enabled=false
management.endpoints.web.exposure.include=*
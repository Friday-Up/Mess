# Docker Compose编排: mess-app + redis + postgres(可选)
# 开发: docker-compose up -d redis
# 完整: docker-compose up -d
# 生产: docker-compose --profile prod up -d
version: '3.8'

services:
  # Spring Boot应用
  mess-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - mess-network

  # Redis缓存 - Alpine精简镜像，开启AOF持久化
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - mess-network

  # PostgreSQL - 生产环境替代H2
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mess
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password  # 生产环境应使用Docker Secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mess-network

# 数据卷 - 持久化容器数据
volumes:
  redis-data:
  postgres-data:

# 网络 - bridge驱动，服务间通过服务名通信
networks:
  mess-network:
    driver: bridge